name: AVEAccessProbe
options:
  bundleIdPrefix: com.aveprobe
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.4'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
targets:
  AVEAccessProbe:
    type: application
    platform: iOS
    deploymentTarget: '17.4'
    sources:
      - path: AVEAccessProbe/AVEAccessProbeApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aveprobe.iosdiagnostic
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: 'AVE Access Probe'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGNING_REQUIRED: 'NO'
        TARGETED_DEVICE_FAMILY: '1'
